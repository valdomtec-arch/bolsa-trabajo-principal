<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Vacante | Portal de Reclutamiento</title>
    <!-- FontAwesome para iconos modernos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de Estilo Dinámicas con Branding Corporativo */
        :root {
            --primary-color: #2563eb; 
            --primary-dark: #1d4ed8;
            --bg-light: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --transition-speed: 0.25s;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 10px 40px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Banner de la Empresa */
        .company-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: var(--border-radius);
            padding: 28px 20px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: var(--shadow-lg);
        }

        .company-header::before {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        .company-logo {
            width: 76px;
            height: 76px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            box-shadow: var(--shadow-md);
            padding: 8px;
        }

        .company-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .company-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .vacant-title {
            font-size: 0.95rem;
            opacity: 0.85;
            font-weight: 300;
        }

        /* Tarjetas de Información */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #e2e8f0;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }
        
        .card-title i {
            color: var(--primary-color);
        }

        /* Especificidades de la Vacante */
        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .spec-item {
            background-color: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }

        .spec-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            display: block;
            margin-bottom: 2px;
        }

        .spec-value {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .spec-full {
            grid-column: span 2;
        }

        /* Campos de Formulario */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: all var(--transition-speed);
            outline: none;
            background-color: #fff;
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px dashed #e2e8f0;
        }

        .toggle-label-group {
            display: flex;
            flex-direction: column;
        }

        .toggle-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .toggle-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .agenda-block {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
            opacity: 0;
        }

        .agenda-block.show {
            max-height: 200px;
            opacity: 1;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f1f5f9;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ENCABEZADO DINÁMICO -->
        <header class="company-header" id="companyHeader">
            <div class="company-logo" id="companyLogoContainer">
                <i class="fa-solid fa-circle-notch fa-spin" style="color: var(--primary-color); font-size: 1.25rem;"></i>
            </div>
            <h1 class="company-name" id="companyName">Cargando empresa...</h1>
            <p class="vacant-title" id="vacantTitle">Buscando vacante disponible...</p>
        </header>

        <!-- DETALLES DE LA VACANTE INYECTADOS AQUÍ -->
        <div id="contenedorEspecificaciones"></div>

        <main id="mainContent">
            <!-- Interfaz de geolocalización y formulario -->
        </main>
    </div>

    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE CORREGIDA
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 2. CAPTURA DE PARÁMETROS DE LA URL
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const idEmpresaUrl = urlParams.get('empresa'); 
        const idPuestoUrl = urlParams.get('puesto'); // Opcional: para forzar una vacante específica

        let datosEmpresaGlobal = null;
        let idVacanteSeleccionada = "";
        let textoPuestoSeleccionado = "";
        let mapaRutasVacantes = {};

        function aplicarBranding(datosEmpresa) {
            if (!datosEmpresa) return;
            const colorPrimario = datosEmpresa.color_primario || '#2563eb';
            const colorOscuro = datosEmpresa.color_oscuro || '#1d4ed8';
            
            document.documentElement.style.setProperty('--primary-color', colorPrimario);
            document.documentElement.style.setProperty('--primary-dark', colorOscuro);

            document.getElementById('companyName').textContent = datosEmpresa.nombre || 'Empresa Aliada';
            
            if (datosEmpresa.logo_url) {
                document.getElementById('companyLogoContainer').innerHTML = `
                    <img src="${datosEmpresa.logo_url}" alt="Logo ${datosEmpresa.nombre}" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
                `;
            } else {
                document.getElementById('companyLogoContainer').innerHTML = `
                    <i class="fa-solid fa-briefcase" style="color: ${colorPrimario}; font-size: 1.75rem;"></i>
                `;
            }
        }

        // ==========================================
        // 3. CONSULTA DE DATOS DE LA EMPRESA
        // ==========================================
        if (idEmpresaUrl) {
            db.ref(`empresas/${idEmpresaUrl}`).once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        datosEmpresaGlobal = snapshot.val();
                        aplicarBranding(datosEmpresaGlobal);
                    } else {
                        document.getElementById('companyName').textContent = "Vacantes Disponibles";
                        document.getElementById('companyLogoContainer').innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 1.75rem;"></i>`;
                    }
                })
                .catch((error) => console.error("Error al conectar con Firebase:", error));
        } else {
            document.getElementById('companyName').textContent = "Portal de Empleo";
            document.getElementById('companyLogoContainer').innerHTML = `<i class="fa-solid fa-globe" style="color: var(--primary-color); font-size: 1.75rem;"></i>`;
            document.getElementById('vacantTitle').textContent = "Selecciona una empresa aliada";
        }

        // ==========================================
        // 4. INTERFAZ DE GEOLOCALIZACIÓN
        // ==========================================
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="card" id="geoCard" style="display:none;">
                <h3 class="card-title"><i class="fa-solid fa-location-crosshairs"></i> Ubicación de planta</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                    Compártenos tu ubicación aproximada para validar las rutas de transporte y vacantes más cercanas.
                </p>
                <button type="button" class="btn-submit" id="btnGeolocalizar" style="background-color: #64748b;">
                    <i class="fa-solid fa-map-pin"></i> Compartir mi ubicación actual
                </button>
                <div id="geoFeedback" style="margin-top: 10px; font-size: 0.8rem; text-align: center; font-weight: 500; display: none;"></div>
            </div>
            <div id="vacanteDetalleContenedor"></div>
        `;

        let coordsCandidato = null;
        const btnGeolocalizar = document.getElementById('btnGeolocalizar');
        const geoFeedback = document.getElementById('geoFeedback');

        btnGeolocalizar.addEventListener('click', () => {
            if (!navigator.geolocation) {
                geoFeedback.style.color = '#ef4444';
                geoFeedback.innerHTML = 'Tu navegador no soporta geolocalización.';
                geoFeedback.style.display = 'block';
                return;
            }
            btnGeolocalizar.disabled = true;
            btnGeolocalizar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Obteniendo ubicación...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    coordsCandidato = { lat: position.coords.latitude, lon: position.coords.longitude };
                    localStorage.setItem('user_lat', coordsCandidato.lat);
                    localStorage.setItem('user_lon', coordsCandidato.lon);

                    btnGeolocalizar.style.backgroundColor = '#10b981'; 
                    btnGeolocalizar.innerHTML = '<i class="fa-solid fa-check"></i> Ubicación obtenida';
                    geoFeedback.style.color = '#10b981';
                    geoFeedback.innerHTML = '¡Ubicación cargada con éxito!';
                    geoFeedback.style.display = 'block';
                },
                (error) => {
                    btnGeolocalizar.disabled = false;
                    btnGeolocalizar.style.backgroundColor = '#64748b';
                    btnGeolocalizar.innerHTML = '<i class="fa-solid fa-map-pin"></i> Intentar de nuevo';
                    geoFeedback.style.color = '#f59e0b'; 
                    geoFeedback.innerHTML = 'No pudimos acceder a tu ubicación. Puedes llenar tu registro manualmente.';
                    geoFeedback.style.display = 'block';
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 3600000 }
            );
        });

        window.addEventListener('load', () => {
            const cachedLat = localStorage.getItem('user_lat');
            const cachedLon = localStorage.getItem('user_lon');
            if (cachedLat && cachedLon) {
                coordsCandidato = { lat: parseFloat(cachedLat), lon: parseFloat(cachedLon) };
                btnGeolocalizar.style.backgroundColor = '#10b981';
                btnGeolocalizar.innerHTML = '<i class="fa-solid fa-check-double"></i> Ubicación guardada';
            }
        });

        // ==========================================
        // 5. INYECCIÓN DEL FORMULARIO DE POSTULACIÓN
        // ==========================================
        const vacanteDetalleContenedor = document.getElementById('vacanteDetalleContenedor');
        vacanteDetalleContenedor.innerHTML = `
            <form id="formPostulacion" class="card" style="display: none;">
                <h3 class="card-title"><i class="fa-solid fa-file-signature"></i> Tu Información de Registro</h3>

                <div class="form-group">
                    <label class="form-label" for="nombreCompleto">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" class="form-control" placeholder="Ej. Juan Pérez Gómez" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="curp">CURP (18 caracteres)</label>
                    <input type="text" id="curp" class="form-control" placeholder="ABC123456XYZ" maxlength="18" style="text-transform: uppercase;" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="telefono">Teléfono (10 dígitos)</label>
                    <input type="tel" id="telefono" class="form-control" placeholder="8112345678" maxlength="10" required autocomplete="tel">
                </div>

                <div class="form-group" id="grupoTransporte" style="display: none;">
                    <label class="form-label" for="selectTransporte">¿Qué ruta de transporte te queda más cerca?</label>
                    <select id="selectTransporte" class="form-control">
                        <option value="">Selecciona una ruta...</option>
                        <option value="No necesito transporte">No necesito transporte de personal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="selectReclutador">¿Quién es tu reclutador asignado?</label>
                    <select id="selectReclutador" class="form-control" required>
                        <option value="">Selecciona tu reclutador...</option>
                    </select>
                </div>

                <div class="toggle-container" id="toggleCitaContainer">
                    <div class="toggle-label-group">
                        <span class="toggle-title"><i class="fa-solid fa-calendar-days"></i> ¿Quieres agendar tu entrevista de una vez?</span>
                        <span class="toggle-desc">Ahorra tiempo y asegura tu lugar en planta.</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="chkAgendarCita">
                        <span class="slider"></span>
                    </label>
                </div>

                <div id="blockAgenda" class="agenda-block">
                    <div class="form-group">
                        <label class="form-label" for="fechaCita">Día de tu entrevista</label>
                        <input type="date" id="fechaCita" class="form-control">
                        <small id="errorFecha" style="color: #ef4444; font-size: 0.75rem; display: none; margin-top: 5px;"></small>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="horaCita">Hora de tu cita</label>
                        <input type="time" id="horaCita" class="form-control" min="08:00" max="17:00">
                        <small id="errorHora" style="color: #ef4444; font-size: 0.75rem; display: none; margin-top: 5px;"></small>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnEnviarPostulacion" style="margin-top: 20px;">
                    <i class="fa-solid fa-paper-plane"></i> Confirmar Postulación
                </button>
            </form>
        `;

        const formPostulacion = document.getElementById('formPostulacion');
        const grupoTransporte = document.getElementById('grupoTransporte');
        const selectTransporte = document.getElementById('selectTransporte');
        const selectReclutador = document.getElementById('selectReclutador');
        const chkAgendarCita = document.getElementById('chkAgendarCita');
        const blockAgenda = document.getElementById('blockAgenda');
        const fechaCita = document.getElementById('fechaCita');
        const horaCita = document.getElementById('horaCita');
        const errorFecha = document.getElementById('errorFecha');
        const errorHora = document.getElementById('errorHora');

        // ==========================================
        // 6. CARGA Y DESPLIEGUE DE ESPECIFICACIONES (ABAJO DEL BANNER)
        // ==========================================
        function cargarVacantesYReclutadores() {
            if (!idEmpresaUrl) return;

            db.ref(`vacantes_detalles/${idEmpresaUrl}`).once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        let datosVacanteSeleccionada = null;

                        // Si viene un puesto en la URL lo buscamos, si no, agarramos el primero
                        if (idPuestoUrl && snapshot.hasChild(idPuestoUrl)) {
                            idVacanteSeleccionada = idPuestoUrl;
                            datosVacanteSeleccionada = snapshot.child(idPuestoUrl).val();
                        } else {
                            snapshot.forEach((child) => {
                                if (!datosVacanteSeleccionada) {
                                    idVacanteSeleccionada = child.key;
                                    datosVacanteSeleccionada = child.val();
                                }
                            });
                        }

                        if (datosVacanteSeleccionada) {
                            const nombreVacante = datosVacanteSeleccionada.vacanteNombre || datosVacanteSeleccionada.nombreVacante || datosVacanteSeleccionada.puesto || idVacanteSeleccionada;
                            const turnos = datosVacanteSeleccionada.turnos || datosVacanteSeleccionada.turno || 'No especificado';
                            textoPuestoSeleccionado = `${nombreVacante} (${turnos})`;

                            // Actualizar Títulos de la cabecera
                            document.getElementById('vacantTitle').textContent = "Detalles y Registro";

                            // Inyectar Especificidades abajo del banner
                            const contenedorEspecificaciones = document.getElementById('contenedorEspecificaciones');
                            contenedorEspecificaciones.innerHTML = `
                                <div class="card">
                                    <h3 class="card-title"><i class="fa-solid fa-briefcase"></i> Especificaciones del Puesto</h3>
                                    <div class="spec-grid">
                                        <div class="spec-item">
                                            <span class="spec-label">Puesto</span>
                                            <span class="spec-value">${nombreVacante}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Sueldo / Salario</span>
                                            <span class="spec-value">${datosVacanteSeleccionada.salario || 'Competitivo'}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Turnos / Horarios</span>
                                            <span class="spec-value">${turnos}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Ubicación / Origen</span>
                                            <span class="spec-value">${datosVacanteSeleccionada.lugarOrigen || 'Planta General'}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Escolaridad</span>
                                            <span class="spec-value">${datosVacanteSeleccionada.escolaridad || 'No requerida'}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Experiencia</span>
                                            <span class="spec-value">${datosVacanteSeleccionada.experiencia || 'Sin experiencia'}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Edad Requerida</span>
                                            <span class="spec-value">${datosVacanteSeleccionada.edad || 'Mayor de edad'}</span>
                                        </div>
                                        <div class="spec-item">
                                            <span class="spec-label">Género</span>
                                            <span class="spec-value">${datosVacanteSeleccionada.sexo || 'Indistinto'}</span>
                                        </div>
                                        <div class="spec-item spec-full">
                                            <span class="spec-label">Actividades</span>
                                            <span class="spec-value" style="font-weight: 400;">${datosVacanteSeleccionada.actividades || 'Las actividades se detallarán en entrevista.'}</span>
                                        </div>
                                        <div class="spec-item spec-full">
                                            <span class="spec-label">Beneficios y Prestaciones</span>
                                            <span class="spec-value" style="font-weight: 400; color: #16a34a;"><i class="fa-solid fa-gift"></i> ${datosVacanteSeleccionada.beneficios || 'Prestaciones de ley.'}</span>
                                        </div>
                                    </div>
                                </div>
                            `;

                            // Configurar Rutas de Transporte para esta vacante
                            let rutasRaw = datosVacanteSeleccionada.rutasTransporte || datosVacanteSeleccionada.rutas_transporte || "";
                            let rutasArr = [];
                            if (typeof rutasRaw === 'string') {
                                rutasArr = rutasRaw.trim() !== "" ? rutasRaw.split(',').map(r => r.trim()) : [];
                            } else if (Array.isArray(rutasRaw)) {
                                rutasArr = rutasRaw;
                            }

                            mapaRutasVacantes[idVacanteSeleccionada] = rutasArr;

                            selectTransporte.innerHTML = `
                                <option value="">Selecciona una ruta...</option>
                                <option value="No necesito transporte">No necesito transporte de personal</option>
                            `;

                            if (rutasArr.length > 0) {
                                rutasArr.forEach((ruta) => {
                                    const option = document.createElement('option');
                                    option.value = ruta;
                                    option.textContent = ruta;
                                    selectTransporte.appendChild(option);
                                });
                                grupoTransporte.style.display = 'block';
                            } else {
                                grupoTransporte.style.display = 'none';
                            }

                            // Mostrar contenedor de geolocalización y el formulario
                            document.getElementById('geoCard').style.display = 'block';
                            formPostulacion.style.display = 'block';
                        } else {
                            document.getElementById('vacantTitle').textContent = "No hay detalles de vacantes disponibles";
                        }
                    } else {
                        document.getElementById('vacantTitle').textContent = "No hay vacantes activas por el momento";
                    }
                })
                .catch((err) => console.error("Error al cargar vacantes:", err));

            // 2. Cargar Reclutadores
            db.ref('reclutadores').once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        selectReclutador.innerHTML = '<option value="">Selecciona tu reclutador...</option>';
                        snapshot.forEach((childSnapshot) => {
                            const datosReclutador = childSnapshot.val();
                            if (datosReclutador.estatus === "activo") {
                                const option = document.createElement('option');
                                option.value = childSnapshot.key;
                                option.textContent = datosReclutador.nombre;
                                option.setAttribute('data-tel', datosReclutador.telefono || '');
                                selectReclutador.appendChild(option);
                            }
                        });
                    }
                });
        }

        if (idEmpresaUrl) {
            cargarVacantesYReclutadores();
        }

        // ==========================================
        // 7. LISTENERS Y VALIDACIONES DE CITAS
        // ==========================================
        chkAgendarCita.addEventListener('change', (e) => {
            if (e.target.checked) {
                blockAgenda.classList.add('show');
                fechaCita.required = true;
                horaCita.required = true;
                establecerLimitesFecha();
            } else {
                blockAgenda.classList.remove('show');
                fechaCita.required = false;
                horaCita.required = false;
                fechaCita.value = "";
                horaCita.value = "";
                errorFecha.style.display = 'none';
                errorHora.style.display = 'none';
            }
        });

        function establecerLimitesFecha() {
            const hoy = new Date();
            const mañana = new Date(hoy);
            mañana.setDate(hoy.getDate() + 1);
            const yyyy = mañana.getFullYear();
            const mm = String(mañana.getMonth() + 1).padStart(2, '0');
            const dd = String(mañana.getDate()).padStart(2, '0');
            fechaCita.min = `${yyyy}-${mm}-${dd}`;
        }

        fechaCita.addEventListener('change', (e) => {
            const fechaSeleccionada = new Date(e.target.value + 'T00:00:00');
            if (fechaSeleccionada.getDay() === 0 || fechaSeleccionada.getDay() === 6) {
                errorFecha.textContent = "Las entrevistas se programan de Lunes a Viernes.";
                errorFecha.style.display = 'block';
                fechaCita.value = "";
            } else {
                errorFecha.style.display = 'none';
            }
        });

        horaCita.addEventListener('change', (e) => {
            const hora = e.target.value;
            if (hora) {
                const [horas, minutos] = hora.split(':').map(Number);
                if (horas < 8 || (horas === 17 && minutos > 0) || horas > 17) {
                    errorHora.textContent = "El horario laboral para citas es de 8:00 AM a 5:00 PM.";
                    errorHora.style.display = 'block';
                    horaCita.value = "";
                } else {
                    errorHora.style.display = 'none';
                }
            }
        });

        // ==========================================
        // 8. CONTROL DE ENVÍO Y RUTA DE WHATSAPP
        // ==========================================
        formPostulacion.addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnEnviar = document.getElementById('btnEnviarPostulacion');
            const textoOriginalBoton = btnEnviar.innerHTML;
            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';

            const nombre = document.getElementById('nombreCompleto').value.trim();
            const curp = document.getElementById('curp').value.trim().toUpperCase();
            const telefono = document.getElementById('telefono').value.trim();
            const rutaTransporte = selectTransporte.value || "No requiere / No especificado";
            const idReclutador = selectReclutador.value;
            const reclutadorOpt = selectReclutador.options[selectReclutador.selectedIndex];
            const nombreReclutador = reclutadorOpt.textContent;
            const telReclutador = reclutadorOpt.getAttribute('data-tel') || '';

            const agendarCitaActivo = chkAgendarCita.checked;
            const fechaCitaValor = fechaCita.value;
            const horaCitaValor = horaCita.value;

            if (curp.length !== 18 || telefono.length !== 10 || isNaN(telefono)) {
                alert("Por favor verifica que la CURP tenga 18 caracteres y el Teléfono 10 dígitos válidos.");
                restablecerBoton();
                return;
            }

            try {
                // Filtro Anti-Duplicados estricto por CURP y Vacante
                const snapshotDuplicados = await db.ref('postulaciones')
                    .orderByChild('curp')
                    .equalTo(curp)
                    .once('value');

                let registroDuplicadoExistente = null;
                if (snapshotDuplicados.exists()) {
                    snapshotDuplicados.forEach((childSnapshot) => {
                        const postulacion = childSnapshot.val();
                        if (postulacion.id_vacante === idVacanteSeleccionada) {
                            registroDuplicadoExistente = { id: childSnapshot.key, ...postulacion };
                        }
                    });
                }

                if (registroDuplicadoExistente) {
                    alert(`¡Hola! Ya detectamos una postulación en curso con tus datos.`);
                    window.location.href = `acuse.html?id=${registroDuplicadoExistente.id}`;
                    return;
                }

                const nuevaPostulacionRef = db.ref('postulaciones').push();
                const nuevoIdPostulacion = nuevaPostulacionRef.key;

                const datosPostulacion = {
                    id: nuevoIdPostulacion,
                    id_empresa: idEmpresaUrl,
                    empresa_nombre: datosEmpresaGlobal ? datosEmpresaGlobal.nombre : 'Empresa Aliada',
                    nombre_candidato: nombre,
                    curp: curp,
                    telefono: telefono,
                    id_vacante: idVacanteSeleccionada,
                    vacante_puesto: textoPuestoSeleccionado,
                    ruta_transporte: rutaTransporte,
                    id_reclutador: idReclutador,
                    nombre_reclutador: nombreReclutador,
                    fecha_registro: new Date().toISOString(),
                    lat_candidato: coordsCandidato ? coordsCandidato.lat : null,
                    lon_candidato: coordsCandidato ? coordsCandidato.lon : null,
                    cita: {
                        solicitada_por_candidato: agendarCitaActivo,
                        fecha: agendarCitaActivo ? fechaCitaValor : "Pendiente de agendar",
                        hora: agendarCitaActivo ? horaCitaValor : "Pendiente de agendar",
                        estatus: agendarCitaActivo ? "pendiente_confirmacion" : "no_solicitada"
                    }
                };

                await nuevaPostulacionRef.set(datosPostulacion);

                let mensajeCitaText = agendarCitaActivo 
                    ? `\n\n📅 *Propuesta de Entrevista:* \nFecha: ${fechaCitaValor}\nHora: ${horaCitaValor} hrs.`
                    : `\n\n📅 *Cita de Entrevista:* Pendiente de coordinar con reclutador.`;

                const mensajeWhatsApp = `*¡Nueva Postulación de Candidato!* 🚀\n\n` +
                    `👤 *Nombre:* ${nombre}\n` +
                    `📄 *CURP:* ${curp}\n` +
                    `📞 *Teléfono:* ${telefono}\n` +
                    `💼 *Vacante:* ${textoPuestoSeleccionado}\n` +
                    `🚌 *Transporte:* ${rutaTransporte}\n` +
                    `🤝 *Reclutador:* ${nombreReclutador}` +
                    mensajeCitaText + `\n\n` +
                    `🔗 *Enlace de Acuse Oficial:* \n` +
                    `${window.location.origin}/acuse.html?id=${nuevoIdPostulacion}`;

                const urlWhatsApp = `https://api.whatsapp.com/send?phone=52${telReclutador}&text=${encodeURIComponent(mensajeWhatsApp)}`;

                alert("¡Postulación guardada exitosamente! Se abrirá tu chat de validación.");
                window.open(urlWhatsApp, '_blank');
                window.location.href = `acuse.html?id=${nuevoIdPostulacion}`;

            } catch (error) {
                console.error("Error al procesar:", error);
                alert("Ocurrió un error inesperado al procesar tu solicitud.");
                restablecerBoton();
            }

            function restablecerBoton() {
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = textoOriginalBoton;
            }
        });
    </script>
</body>
</html>
