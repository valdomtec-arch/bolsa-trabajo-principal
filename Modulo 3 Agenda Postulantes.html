<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Postulantes - Logística de Reclutamiento</title>
    <!-- Tailwind CSS para Estilos Rápidos y Limpios -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para los Gráficos Demográficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS para la Exportación a Excel Limpia -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Definición de Colores del Semáforo */
        .status-postulado { background-color: #EF4444; color: white; } /* 🔴 Rojo */
        .status-entrevista { background-color: #F59E0B; color: white; } /* 🟡 Amarillo */
        .status-induccion { background-color: #3B82F6; color: white; }  /* 🔵 Azul */
        .status-contratado { background-color: #10B981; color: white; } /* 🟢 Verde */
        .status-declinante { background-color: #6B7280; color: white; } /* ⚫ Gris */
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="flex h-screen overflow-hidden">
        
        <!-- CONTENIDO PRINCIPAL DEL DASHBOARD -->
        <main class="flex-1 overflow-y-auto p-6">
            
            <!-- ENCABEZADO Y ACCIONES GLOBALES -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Módulo 3: Control de Postulantes</h1>
                    <p class="text-sm text-gray-600">Seguimiento, analítica demográfica y automatización de procesos.</p>
                </div>
                <button onclick="exportarExcel()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow flex items-center gap-2 text-sm transition-all">
                    📄 Exportar Base de Datos (Excel)
                </button>
            </div>

            <!-- FILTROS MAESTROS EN CASCADA -->
            <div class="bg-white p-4 rounded-lg shadow mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Filtrar por Empresa</label>
                    <select id="filtroEmpresa" onchange="cargarPostulantes()" class="w-full bg-gray-50 border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="TODAS">-- Todas las Empresas --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Filtrar por Vacante</label>
                    <select id="filtroVacante" onchange="cargarPostulantes()" class="w-full bg-gray-50 border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="TODAS">-- Todas las Vacantes --</option>
                    </select>
                </div>
            </div>

            <!-- SECCIÓN DE ANALÍTICA DEMOGRÁFICA -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white p-4 rounded-lg shadow flex flex-col items-center">
                    <h3 class="text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Comportamiento por Sexo</h3>
                    <div class="w-full h-48 flex justify-center">
                        <canvas id="chartSexo"></canvas>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow flex flex-col items-center">
                    <h3 class="text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Distribución por Rangos de Edad</h3>
                    <div class="w-full h-48 flex justify-center">
                        <canvas id="chartEdad"></canvas>
                    </div>
                </div>
            </div>

            <!-- TABLA DE POSTULANTES CON SEMÁFORO -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-800 text-white text-xs uppercase tracking-wider">
                                <th class="p-3">Estatus</th>
                                <th class="p-3">Postulado</th>
                                <th class="p-3">Identificación (CURP / Edad / Sexo)</th>
                                <th class="p-3">Empresa y Vacante</th>
                                <th class="p-3">Logística / Cita</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPostulantes" class="text-sm divide-y divide-gray-200">
                            <!-- Los registros se inyectarán de forma dinámica aquí -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL INTEGRADO PARA EDICIÓN Y GESTIÓN DE CITAS/ESTATUS -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 relative">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Actualizar Expediente de Candidato</h2>
            <input type="hidden" id="editId">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Nombre Completo</label>
                    <input type="text" id="editNombre" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Teléfono</label>
                    <input type="text" id="editTelefono" class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Cambiar Estado (Semáforo)</label>
                    <select id="editEstatus" class="w-full border rounded p-2 text-sm">
                        <option value="Postulado">🔴 Postulado</option>
                        <option value="En Entrevista">🟡 En Entrevista</option>
                        <option value="Inducción">🔵 Inducción</option>
                        <option value="Contratado">🟢 Contratado</option>
                        <option value="Declinante">⚫ Declinante</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Día / Fecha de Entrevista</label>
                    <input type="text" id="editDiaEntrevista" placeholder="Ej. Miércoles o AAAA-MM-DD" class="w-full border rounded p-2 text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="cerrarModal()" class="px-4 py-2 border rounded text-sm font-semibold text-gray-600 hover:bg-gray-100">Cancelar</button>
                <button onclick="guardarCambiosAdmin()" class="px-4 py-2 bg-purple-600 text-white rounded text-sm font-semibold hover:bg-purple-700">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- SDK DE FIREBASE (Asegúrate de usar la versión correcta de tu configuración global) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // CONFIGURACIÓN DE TU REALTIME DATABASE DE FIREBASE
        const firebaseConfig = {
            databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Variables de Control Local de Datos
        let todosLosPostulantes = {};
        let chartSexoInstance = null;
        let chartEdadInstance = null;

        // Inicialización Automatizada del Panel
        document.addEventListener("DOMContentLoaded", () => {
            inicializarEscuchaFirebase();
        });

        // Escucha Activa en Tiempo Real del Nodo 'postulantes'
        function inicializarEscuchaFirebase() {
            db.ref("postulantes").on("value", (snapshot) => {
                todosLosPostulantes = snapshot.val() || {};
                actualizarFiltrosEstructurales();
                cargarPostulantes();
            });
        }

        // Población Dinámica de Selectores en Cascada (Evita redundancia en Multiempresa)
        function actualizarFiltrosEstructurales() {
            const filtroEmpresa = document.getElementById("filtroEmpresa");
            const filtroVacante = document.getElementById("filtroVacante");
            
            const empresaSeleccionada = filtroEmpresa.value;
            const vacanteSeleccionada = filtroVacante.value;

            const empresasSet = new Set();
            const vacantesSet = new Set();

            Object.values(todosLosPostulantes).forEach(p => {
                if (p.empresa) empresasSet.add(p.empresa);
                if (p.vacante) vacantesSet.add(p.vacante);
            });

            // Limpieza y repoblación preservando la selección previa
            filtroEmpresa.innerHTML = '<option value="TODAS">-- Todas las Empresas --</option>';
            empresasSet.forEach(emp => {
                filtroEmpresa.innerHTML += `<option value="${emp}">${emp}</option>`;
            });
            filtroEmpresa.value = empresasSet.has(empresaSeleccionada) ? empresaSeleccionada : "TODAS";

            filtroVacante.innerHTML = '<option value="TODAS">-- Todas las Vacantes --</option>';
            vacantesSet.forEach(vac => {
                filtroVacante.innerHTML += `<option value="${vac}">${vac}</option>`;
            });
            filtroVacante.value = vacantesSet.has(vacanteSeleccionada) ? vacanteSeleccionada : "TODAS";
        }

        // Renderizado e Inyección Dinámica de Datos y Lógica del Semáforo
        function cargarPostulantes() {
            const tabla = document.getElementById("tablaPostulantes");
            tabla.innerHTML = "";

            const empresaFiltro = document.getElementById("filtroEmpresa").value;
            const vacanteFiltro = document.getElementById("filtroVacante").value;

            // Contadores de Métricas Demográficas
            let metricaSexo = { Masculino: 0, Femenino: 0, Otro: 0 };
            let metricaEdad = { "18-25": 0, "26-35": 0, "36-45": 0, "46+": 0 };

            Object.entries(todosLosPostulantes).forEach(([id, p]) => {
                // Filtros Maestros en Cascada
                if (empresaFiltro !== "TODAS" && p.empresa !== empresaFiltro) return;
                if (vacanteFiltro !== "TODAS" && p.vacante !== vacanteFiltro) return;

                // Indexación de Analítica
                if (p.sexo === "Masculino" || p.sexo === "Femenino") {
                    metricaSexo[p.sexo]++;
                } else {
                    metricaSexo["Otro"]++;
                }

                const edadNum = parseInt(p.edad) || 0;
                if (edadNum >= 18 && edadNum <= 25) metricaEdad["18-25"]++;
                else if (edadNum >= 26 && edadNum <= 35) metricaEdad["26-35"]++;
                else if (edadNum >= 36 && edadNum <= 45) metricaEdad["36-45"]++;
                else if (edadNum > 45) metricaEdad["46+"]++;

                // Mapeo Estricto de Clases del Semáforo de Procesos
                let claseSemaforo = "status-postulado";
                let estatusActual = p.estatus || "Postulado";

                if (estatusActual === "En Entrevista") claseSemaforo = "status-entrevista";
                else if (estatusActual === "Inducción") claseSemaforo = "status-induccion";
                else if (estatusActual === "Contratado") claseSemaforo = "status-contratado";
                else if (estatusActual === "Declinante") claseSemaforo = "status-declinante";

                // Preparación de Textos Inteligentes para Mensajería de WhatsApp Contextual
                let mensajeWhatsApp = `Hola *${p.nombre}*, te saludamos de Reclutamiento. Con respecto a tu postulación para *${p.vacante}* en la empresa *${p.empresa}*, te informamos que tu estatus actual es: *${estatusActual}*.`;
                if(estatusActual === "En Entrevista" && p.diaEntrevista) {
                    mensajeWhatsApp += ` Recuerda que tu cita está agendada para el día: *${p.diaEntrevista}*.`;
                }
                // Data Anchor de Logística listo en el string del mensaje
                if(p.logistica_ruta_id) {
                    mensajeWhatsApp += ` Ruta de transporte asignada: *${p.logistica_ruta_id}*.`;
                }

                const urlWhatsApp = `https://wa.me/52${p.telefono}?text=${encodeURIComponent(mensajeWhatsApp)}`;

                // Renderizado de Fila
                tabla.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-3">
                            <span class="px-2 py-1 text-xs font-bold rounded shadow-sm ${claseSemaforo}">
                                ${estatusActual}
                            </span>
                        </td>
                        <td class="p-3">
                            <div class="font-bold text-gray-900">${p.nombre}</div>
                            <div class="text-xs text-gray-500">${p.telefono}</div>
                        </td>
                        <td class="p-3">
                            <div class="font-mono text-xs text-gray-700">${p.curp || 'SIN CURP'}</div>
                            <div class="text-xs text-gray-500">${p.sexo || 'No definido'} • ${p.edad || 0} años</div>
                        </td>
                        <td class="p-3">
                            <div class="text-xs font-semibold text-purple-700">${p.empresa}</div>
                            <div class="text-xs font-bold text-gray-800">${p.vacante}</div>
                        </td>
                        <td class="p-3">
                            <div class="text-xs text-gray-700">🗓️ Cita: <span class="font-semibold text-amber-700">${p.diaEntrevista || 'Por agendar'}</span></div>
                            <div class="text-xs text-gray-400 italic">Ruta: ${p.logistica_ruta_id || 'Pendiente (Módulo Logística)'}</div>
                        </td>
                        <td class="p-3 text-center">
                            <div class="flex justify-center items-center gap-2">
                                <a href="${urlWhatsApp}" target="_blank" title="Enviar WhatsApp Inteligente" class="bg-green-500 hover:bg-green-600 text-white p-1.5 rounded-full shadow transition-all">
                                    📲
                                </a>
                                <button onclick="abrirModalEditar('${id}')" title="Editar Expediente" class="bg-blue-500 hover:bg-blue-600 text-white p-1.5 rounded-full shadow transition-all">
                                    ✏️
                                </button>
                                <button onclick="eliminarPostulante('${id}')" title="Borrar Registro" class="bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-full shadow transition-all">
                                    🗑️
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            actualizarGraficosDemograficos(metricaSexo, metricaEdad);
        }

        // Renderizado y Ciclo de Vida de Gráficos de Chart.js
        function actualizarGraficosDemograficos(sexoData, edadData) {
            if (chartSexoInstance) chartSexoInstance.destroy();
            if (chartEdadInstance) chartEdadInstance.destroy();

            const ctxSexo = document.getElementById('chartSexo').getContext('2d');
            chartSexoInstance = new Chart(ctxSexo, {
                type: 'pie',
                data: {
                    labels: ['Masculino', 'Femenino', 'Otro'],
                    datasets: [{
                        data: [sexoData.Masculino, sexoData.Femenino, sexoData.Otro],
                        backgroundColor: ['#3B82F6', '#EC4899', '#9CA3AF']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxEdad = document.getElementById('chartEdad').getContext('2d');
            chartEdadInstance = new Chart(ctxEdad, {
                type: 'bar',
                data: {
                    labels: ['18-25', '26-35', '36-45', '46+'],
                    datasets: [{
                        label: 'Postulantes',
                        data: [edadData["18-25"], edadData["26-35"], edadData["36-45"], edadData["46+"]],
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        // Lógica de Modales e Interfaz de Usuario de Edición Manual
        function abrirModalEditar(id) {
            const p = todosLosPostulantes[id];
            document.getElementById("editId").value = id;
            document.getElementById("editNombre").value = p.nombre || "";
            document.getElementById("editTelefono").value = p.telefono || "";
            document.getElementById("editEstatus").value = p.estatus || "Postulado";
            document.getElementById("editDiaEntrevista").value = p.diaEntrevista || "";
            document.getElementById("modalEditar").classList.remove("hidden");
        }

        function cerrarModal() {
            document.getElementById("modalEditar").classList.add("hidden");
        }

        // Guardado de Cambios en Firebase con Estructura Homogénea e ISO Logs
        function guardarCambiosAdmin() {
            const id = document.getElementById("editId").value;
            const updates = {
                nombre: document.getElementById("editNombre").value,
                telefono: document.getElementById("editTelefono").value,
                estatus: document.getElementById("editEstatus").value,
                diaEntrevista: document.getElementById("editDiaEntrevista").value,
                fechaActualizacionAdmin: new Date().toISOString()
            };

            db.ref(`postulantes/${id}`).update(updates)
                .then(() => {
                    cerrarModal();
                    // Ejecución de Registro de Logs en Caja Negra de Auditoría
                    registrarAuditoriaLog(id, updates.estatus);
                })
                .catch(err => alert("Error al actualizar: " + err.message));
        }

        // Registro en Nodo Remoto 'sistema_logs' para Auditoría Completa
        function registrarAuditoriaLog(postulanteId, nuevoEstatus) {
            const logEntry = {
                evento: "CAMBIO_ESTATUS_POSTULANTE",
                postulanteId: postulanteId,
                nuevoEstatus: nuevoEstatus,
                timestamp: new Date().toISOString(),
                operador: "Administrador_Sistema"
            };
            db.ref("sistema_logs").push(logEntry);
        }

        // Borrado Lógico / Físico con Confirmación Nativa
        function eliminarPostulante(id) {
            if (confirm(`¿Está completamente seguro de eliminar permanentemente el registro de ${todosLosPostulantes[id].nombre}?`)) {
                db.ref(`postulantes/${id}`).remove()
                    .then(() => {
                        const logEntry = {
                            evento: "ELIMINACION_POSTULANTE",
                            postulanteId: id,
                            timestamp: new Date().toISOString(),
                            operador: "Administrador_Sistema"
                        };
                        db.ref("sistema_logs").push(logEntry);
                    });
            }
        }

        // Exportación de Datos Limpia de la Cuadrícula a Formato Microsoft Excel (.xlsx)
        function exportarExcel() {
            const dataToExport = [];
            const empresaFiltro = document.getElementById("filtroEmpresa").value;
            const vacanteFiltro = document.getElementById("filtroVacante").value;

            Object.values(todosLosPostulantes).forEach(p => {
                if (empresaFiltro !== "TODAS" && p.empresa !== empresaFiltro) return;
                if (vacanteFiltro !== "TODAS" && p.vacante !== vacanteFiltro) return;

                dataToExport.push({
                    "Nombre Completo": p.nombre,
                    "Teléfono": p.telefono,
                    "CURP": p.curp,
                    "Edad": p.edad,
                    "Sexo": p.sexo,
                    "Empresa": p.empresa,
                    "Vacante": p.vacante,
                    "Estatus Proceso": p.estatus,
                    "Día Entrevista": p.diaEntrevista,
                    "Ruta Logística Asignada": p.logistica_ruta_id || "Pendiente",
                    "Fecha de Registro": p.fechaRegistro,
                    "Última Modificación Admin": p.fechaActualizacionAdmin || "N/A"
                });
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            XLSX.utils.book_append_sheet(wb, ws, "Postulantes");
            XLSX.writeFile(wb, `Reporte_Postulantes_${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
