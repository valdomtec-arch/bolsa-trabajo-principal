name: Despachador Nocturno de Recordatorios de Entrevista

on:
  schedule:
    # 21:00 hrs de México (UTC-6 -> 03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparar manualmente desde la pestaña Actions

jobs:
  despacho-recordatorios:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar Script de Despacho
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          ADMIN_PHONE: ${{ secrets.ADMIN_WHATSAPP_PHONE }}
        run: node .github/workflows/script-centinela.js