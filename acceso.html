<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - Bolsa de Trabajo</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-orange: #ff6600;
            --primary-orange-hover: #e05500;
            --secondary-blue: #0f2a4a;
            --bg-page: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --input-bg: #0f172a;
            --white: #ffffff;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --red-alert: #ef4444;
            --border-color: rgba(30, 58, 138, 0.4);
            --radius-md: 12px;
            --radius-lg: 18px;
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #0d1e3d 0%, var(--bg-page) 85%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(12px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header i {
            font-size: 2.8rem;
            color: var(--primary-orange);
            margin-bottom: 12px;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i.icon-left {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .input-container input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--white);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-container input:focus {
            border-color: var(--primary-orange);
        }

        /* BOTÓN PESTAÑITA PARA VER CONTRASEÑA */
        .toggle-password {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: color 0.3s ease, background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--primary-orange);
            background: rgba(255, 102, 0, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-hover) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: var(--white);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.4);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--red-alert);
            color: var(--red-alert);
            padding: 10px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--white);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-user-shield"></i>
            <h2>Acceso Administrativo</h2>
            <p>Ingresa tus credenciales autorizadas</p>
        </div>

        <div id="errorAlert" class="error-msg">
            Credenciales incorrectas o usuario sin acceso.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-container">
                    <i class="fas fa-envelope icon-left"></i>
                    <input type="email" id="email" placeholder="usuario@empresa.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-container">
                    <i class="fas fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePasswordBtn" title="Mostrar/Ocultar contraseña">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
        </form>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Volver a la Bolsa de Trabajo
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxgP1YnycCEqkQ2vr3SPkwc9QMhtG8Zqw",
            authDomain: "bolsa-de-trabajo-a52e4.firebaseapp.com",
            databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com",
            projectId: "bolsa-de-trabajo-a52e4",
            storageBucket: "bolsa-de-trabajo-a52e4.firebasestorage.app",
            messagingSenderId: "592492733212",
            appId: "1:592492733212:web:88e8ec243bd53608b6d0d9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // FUNCIONALIDAD PARA MOSTRAR/OCULTAR CONTRASEÑA
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // Cambiar ícono del ojo
            togglePasswordIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // AUTENTICACIÓN
        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const btnLogin = document.getElementById('btnLogin');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';
            btnLogin.innerText = 'Validando...';
            btnLogin.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value.trim();

            try {
                // 1. Autenticar en Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // 2. Consultar perfil y nivel de rol en Realtime Database
                const userSnapshot = await get(ref(db, `usuarios/${uid}`));
                
                if (userSnapshot.exists()) {
                    const userData = userSnapshot.val();
                    
                    // Guardar sesión local
                    sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                        uid: uid,
                        email: email,
                        nombre: userData.nombre || "Usuario",
                        nivel: userData.nivel || 1,
                        rolNombre: userData.rolNombre || "Administrador",
                        permisos: userData.permisos || {},
                        empresasAsignadas: userData.empresasAsignadas || []
                    }));

                    // 3. Redirección según nivel
                    if (userData.nivel === 5 || userData.esMaster) {
                        window.location.href = "m5_staff.html";
                    } else {
                        window.location.href = "admin.html";
                    }
                } else {
                    sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                        uid: uid,
                        email: email,
                        nombre: email.split('@')[0],
                        nivel: 1,
                        rolNombre: "Administrador Global"
                    }));
                    window.location.href = "admin.html";
                }

            } catch (error) {
                console.error("Error de autenticación:", error);
                errorAlert.textContent = "Error de acceso: Usuario o contraseña incorrectos.";
                errorAlert.style.display = 'block';
            } finally {
                btnLogin.innerText = 'Iniciar Sesión';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
