<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro al ERP | Portal de Reclutamiento</title>

  <!-- Bootstrap 5, FontAwesome y Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --primary-orange: #ff6600;
      --primary-orange-hover: #e05500;
      --primary-orange-glow: rgba(255, 102, 0, 0.35);
      --bg-page: #030712;          
      --container-bg: #0b1329;     
      --bg-form: #0d1b3e;          
      --input-bg: #15264a;         
      --text-light: #f1f5f9;       
      --text-muted: #94a3b8;       
      --border-color: rgba(30, 58, 138, 0.4);     
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: radial-gradient(circle at 50% 10%, #0d1e3d 0%, var(--bg-page) 90%); color: var(--text-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .login-card { width: 100%; max-width: 440px; background: var(--container-bg); border: 1px solid var(--border-color); border-top: 4px solid var(--primary-orange); border-radius: var(--radius-lg); box-shadow: 0 25px 60px rgba(0,0,0,0.8); overflow: hidden; backdrop-filter: blur(10px); }
    .login-header { background: rgba(15, 26, 48, 0.8); padding: 30px 25px 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
    .form-control, .input-group-text { background-color: var(--input-bg) !important; border: 1px solid rgba(255, 255, 255, 0.12) !important; color: #fff !important; border-radius: 10px; }
    .form-control:focus { border-color: var(--primary-orange) !important; box-shadow: 0 0 12px var(--primary-orange-glow) !important; }

    .btn-orange { background: linear-gradient(135deg, var(--primary-orange) 0%, #e05500 100%); color: #fff; border: none; font-weight: 700; border-radius: 10px; padding: 12px; width: 100%; transition: all 0.2s ease; }
    .btn-orange:hover { transform: translateY(-1px); box-shadow: 0 4px 15px var(--primary-orange-glow); color: #fff; }
    
    .link-orange { color: var(--primary-orange); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .link-orange:hover { text-decoration: underline; color: #ff8533; }

    .modal-content { background-color: var(--container-bg); border: 1px solid var(--border-color); color: var(--text-light); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <i class="fas fa-shield-halved text-warning fs-1 mb-2"></i>
      <h4 class="fw-bold mb-1">Acceso al Sistema ERP</h4>
      <p class="text-muted small mb-0">Gestión de Reclutamiento y Operaciones</p>
    </div>

    <div class="p-4">
      <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>

      <form id="formLogin">
        <div class="mb-3">
          <label for="loginEmail" class="form-label small text-light fw-semibold">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text text-muted"><i class="bi bi-envelope-fill"></i></span>
            <input type="email" class="form-control" id="loginEmail" placeholder="usuario@dominio.com" required autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label small text-light fw-semibold mb-0">Contraseña</label>
            <a href="javascript:void(0)" class="link-orange" id="btnOlvidePass">¿Olvidaste tu clave?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text text-muted"><i class="bi bi-key-fill"></i></span>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="btnToggleLoginPass" title="Ver / Ocultar">
              <i class="bi bi-eye" id="iconToggleLoginPass"></i>
            </button>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-orange" id="btnLogin">
            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL OBLIGATORIO: CAMBIO DE CONTRASEÑA POR PRIMER LOGIN -->
  <div class="modal fade" id="modalPrimerCambioPass" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-warning">
        <div class="modal-header bg-dark border-warning">
          <h5 class="modal-title fw-bold text-warning"><i class="bi bi-shield-lock-fill me-2"></i>Actualización Requerida</h5>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-3">
            Por protocolo de seguridad empresarial, debes cambiar tu clave temporal por una contraseña definitiva antes de ingresar.
          </p>
          <div id="modalAlertBox" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>
          <form id="formCambioObligatorio">
            <div class="mb-3">
              <label for="nuevaPass" class="form-label small fw-semibold">Nueva Contraseña Definitiva</label>
              <div class="input-group">
                <input type="password" class="form-control" id="nuevaPass" minlength="6" placeholder="Mínimo 6 caracteres" required>
                <button class="btn btn-outline-secondary" type="button" id="btnToggleNewPass">
                  <i class="bi bi-eye" id="iconToggleNewPass"></i>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <label for="confirmaPass" class="form-label small fw-semibold">Confirma tu Contraseña</label>
              <input type="password" class="form-control" id="confirmaPass" minlength="6" placeholder="Repite la contraseña" required>
            </div>
            <button type="submit" class="btn btn-orange" id="btnGuardarDefinitiva">
              Guardar Contraseña y Entrar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LÓGICA CORE DE AUTENTICACIÓN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, updatePassword, signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
      getDatabase, ref, get, update, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDxgP1YnycCEqkQ2vr3SPkwc9QMhtG8Zqw",
      authDomain: "bolsa-de-trabajo-a52e4.firebaseapp.com",
      databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com",
      projectId: "bolsa-de-trabajo-a52e4",
      storageBucket: "bolsa-de-trabajo-a52e4.firebasestorage.app",
      messagingSenderId: "592492733212",
      appId: "1:592492733212:web:88e8ec243bd53608b6d0d9",
      measurementId: "G-DH2LD3BJEF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const alertBox = document.getElementById('alertBox');
    const modalPrimerCambio = new bootstrap.Modal(document.getElementById('modalPrimerCambioPass'));
    let usuarioAutenticadoActual = null;

    function mostrarError(mensaje) {
      alertBox.textContent = mensaje;
      alertBox.classList.remove('d-none');
    }

    function ocultarError() {
      alertBox.classList.add('d-none');
      alertBox.textContent = '';
    }

    // 1. TOGGLES DEL OJO PARA CONTRASEÑAS
    function configurarToggle(btnId, inputId, iconId) {
      document.getElementById(btnId).addEventListener('click', () => {
        const inp = document.getElementById(inputId);
        const ico = document.getElementById(iconId);
        const isPass = inp.type === 'password';
        inp.type = isPass ? 'text' : 'password';
        ico.className = isPass ? 'bi bi-eye-slash text-warning' : 'bi bi-eye';
      });
    }
    configurarToggle('btnToggleLoginPass', 'loginPassword', 'iconToggleLoginPass');
    configurarToggle('btnToggleNewPass', 'nuevaPass', 'iconToggleNewPass');

    // 2. INICIO DE SESIÓN CON VALIDACIÓN DE ESTATUS Y BANDERA DE SEGURIDAD
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarError();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Validando...`;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const user = cred.user;

        // Comprobar la ficha en usuarios_reclutadores
        const snap = await get(ref(db, `usuarios_reclutadores/${user.uid}`));

        if (!snap.exists()) {
          await signOut(auth);
          throw new Error("No tienes un perfil de colaborador asignado en el ERP.");
        }

        const datos = snap.val();

        // Candado por Inactividad Operativa
        if (datos.estatus !== 'Activo') {
          await signOut(auth);
          throw new Error("Tu cuenta está suspendida o en estatus inactivo. Contacta a la administración.");
        }

        // Si tiene la bandera de primer cambio de contraseña activa
        if (datos.debeCambiarPassword) {
          usuarioAutenticadoActual = user;
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión`;
          modalPrimerCambio.show();
          return;
        }

        // Acceso aprobado: Aterrizar en el Hub Central
        window.location.href = "admin.html";

      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión`;
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          mostrarError("Correo electrónico o contraseña incorrectos.");
        } else {
          mostrarError(err.message);
        }
      }
    });

    // 3. CAMBIO OBLIGATORIO DE CLAVE EN PRIMER INICIO
    document.getElementById('formCambioObligatorio').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('nuevaPass').value.trim();
      const p2 = document.getElementById('confirmaPass').value.trim();
      const modalAlert = document.getElementById('modalAlertBox');

      modalAlert.classList.add('d-none');

      if (p1.length < 6) {
        modalAlert.textContent = "La contraseña debe tener mínimo 6 caracteres.";
        modalAlert.classList.remove('d-none');
        return;
      }
      if (p1 !== p2) {
        modalAlert.textContent = "Las contraseñas no coinciden.";
        modalAlert.classList.remove('d-none');
        return;
      }

      const btnG = document.getElementById('btnGuardarDefinitiva');
      btnG.disabled = true;
      btnG.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Actualizando...`;

      try {
        await updatePassword(usuarioAutenticadoActual, p1);

        // Desactivar la bandera en Realtime Database
        await update(ref(db, `usuarios_reclutadores/${usuarioAutenticadoActual.uid}`), {
          debeCambiarPassword: false,
          fechaCambioPassword: serverTimestamp()
        });

        modalPrimerCambio.hide();
        // Redirigir al Hub Central tras actualizar credencial
        window.location.href = "admin.html";
      } catch (err) {
        btnG.disabled = false;
        btnG.textContent = "Guardar Contraseña y Entrar";
        modalAlert.textContent = "Error al actualizar la contraseña: " + err.message;
        modalAlert.classList.remove('d-none');
      }
    });

    // 4. AUTONOMÍA: RECUPERACIÓN / OLVIDÉ MI CONTRASEÑA
    document.getElementById('btnOlvidePass').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) {
        alert("Por favor escribe primero tu correo electrónico en el campo de arriba para enviarte el enlace de restablecimiento.");
        document.getElementById('loginEmail').focus();
        return;
      }

      if (confirm(`¿Enviar enlace para restablecer contraseña a ${email}?`)) {
        try {
          await sendPasswordResetEmail(auth, email);
          alert(`Te hemos enviado un correo a ${email}. Revisa tu bandeja de entrada o spam para definir tu nueva contraseña.`);
        } catch (err) {
          alert("No se pudo enviar el correo de recuperación: " + err.message);
        }
      }
    });
  </script>
</body>
</html>
