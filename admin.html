<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Consola de Control Maestro</title>
    
    <!-- Frameworks de Estilo e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-orange: #ff6600;
            --primary-orange-hover: #e05500;
            --bg-page: #030712;          
            --card-bg: rgba(15, 23, 42, 0.55);          
            --border-subtle: rgba(255, 102, 0, 0.12);     
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;       
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0d1e3d 0%, var(--bg-page) 85%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px;
        }

        /* BARRA DE NAVEGACIÓN SUPERIOR */
        .navbar-clean {
            background: rgba(3, 7, 18, 0.8);
            border-bottom: 2px solid var(--border-subtle);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 0;
        }

        .navbar-brand-tech {
            color: var(--text-main) !important;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .navbar-brand-tech span {
            color: var(--primary-orange);
        }

        .user-pill {
            background: rgba(255, 102, 0, 0.06);
            border: 1px solid rgba(255, 102, 0, 0.2);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-orange);
            letter-spacing: 0.5px;
        }

        /* ENCABEZADO CENTRAL */
        .hero-section {
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        .hero-section h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }

        /* CONTENEDOR MAESTRO DE BLOQUES DINÁMICOS */
        .catalog-container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* FILAS CUADRICULADAS DINÁMICAS (4 BLOQUES POR FILA) */
        .row-blocks {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        /* ESTRUCTURA INDIVIDUAL DEL BLOQUE CENTRADO ABSOLUTO */
        .module-node {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;    
            text-align: center;     
            min-height: 240px;      
            position: relative;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .module-node:hover {
            border-color: rgba(255, 102, 0, 0.4);
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        /* INDICADOR ESTRATÉGICO SUPERIOR (ID MONOESPACIADO) */
        .node-id {
            font-family: monospace;
            font-size: 0.7rem;
            color: var(--primary-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        /* TÍTULO PRINCIPAL */
        .module-title {
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        /* DESCRIPCIÓN ATENUADA */
        .module-desc {
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 220px;
        }

        /* ICONO COMPACTO COMO GUÍA INTEGRADA */
        .icon-indicator {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .module-node:hover .icon-indicator {
            color: var(--primary-orange);
            opacity: 1;
            transform: scale(1.15);
        }

        /* EL BOTÓN ERGONÓMICO MAESTRO */
        .btn-ergonomic {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: auto; 
            transition: all 0.2s ease;
            width: fit-content;
        }

        .module-node:hover .btn-ergonomic {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.25);
        }

        /* PUNTO DE AUDITORÍA INTEGRADO DISCRETO */
        .node-flag {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }
        .critical-node .node-flag { background: #ef4444; }
        .core-node .node-flag { background: #3b82f6; }
        .custom-node .node-flag { background: #a855f7; }

        /* SKELETON PRECARGA */
        .skeleton-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .skeleton-box {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 14px;
            height: 240px;
        }

        @media (max-width: 992px) {
            .row-blocks, .skeleton-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .row-blocks, .skeleton-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-clean">
        <div class="container px-4 d-flex justify-content-between align-items-center">
            <span class="navbar-brand-tech">
                Core<span>Hub</span>
            </span>
            <span id="userSessionDisplay" class="user-pill">
                Autenticando...
            </span>
        </div>
    </nav>

    <!-- ENCABEZADO DE LA CONSOLA -->
    <header class="hero-section">
        <h1>Consola de Control</h1>
        <p>Estructura operativa global sincronizada en tiempo real.</p>
        <button onclick="cerrarSesionAdmin()" class="btn btn-sm btn-link text-decoration-none text-muted p-0 font-monospace" style="font-size: 0.75rem;">
            <i class="fa-solid fa-power-off me-1"></i> Desconectar Terminal
        </button>
    </header>

    <!-- CONTENEDOR CENTRAL DEL CATÁLOGO -->
    <main class="catalog-container">
        <div id="hub-modulos-dinamico">
            <div class="skeleton-row mb-3">
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
            </div>
            <div class="skeleton-row">
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
            </div>
        </div>
    </main>

    <!-- DEPENDENCIAS OFICIALES DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let rolUsuarioActivo = "SuperAdmin";
        const BASE_URL = "https://valdomtec-arch.github.io/bolsa-trabajo-principal/";

        document.addEventListener("DOMContentLoaded", () => {
            const usuarioSesion = sessionStorage.getItem('usuarioLogueado');
            
            if (usuarioSesion) {
                try {
                    const usuario = JSON.parse(usuarioSesion);
                    rolUsuarioActivo = usuario.rol || "SuperAdmin";
                    document.getElementById('userSessionDisplay').innerText = `${usuario.nombre || 'Administrador'} • ${rolUsuarioActivo}`;
                } catch(e) {
                    rolUsuarioActivo = "SuperAdmin";
                    document.getElementById('userSessionDisplay').innerText = `Administrador • SuperAdmin`;
                }
            } else {
                rolUsuarioActivo = "SuperAdmin";
                document.getElementById('userSessionDisplay').innerText = `Sesión Directa • SuperAdmin`;
            }

            sincronizarRutasOficiales();
        });

        function cerrarSesionAdmin() {
            sessionStorage.removeItem('usuarioLogueado');
            window.location.href = BASE_URL + "indice.html";
        }

        // Sincroniza y fuerza las URLs ABSOLUTAS exactas de admin.html en Firebase Realtime Database
        function sincronizarRutasOficiales() {
            const refModulos = db.ref("modulos_config");

            const estructuraMaestra = {
                "m1_empresas": { id: "m1_empresas", titulo: "Registrar Empresas", descripcion: "Alta de clientes corporativos, marcas y logos.", icono: "fa-building", url: `${BASE_URL}m1_empresas.html`, activo: true, orden: 1, tipo: "standard", roles_permitidos: ["SuperAdmin", "Reclutador"] },
                "m2_vacantes": { id: "m2_vacantes", titulo: "Control Vacantes (IA)", descripcion: "Motor IA Gemini para extracción de perfiles.", icono: "fa-briefcase", url: `${BASE_URL}m2_vacantes.html`, activo: true, orden: 2, tipo: "standard", roles_permitidos: ["SuperAdmin", "Reclutador"] },
                "m3_agenda": { id: "m3_agenda", titulo: "Agenda y Postulantes", descripcion: "Seguimiento de candidatos y generación de acuse.html.", icono: "fa-calendar-days", url: `${BASE_URL}m3_agenda.html`, activo: true, orden: 3, tipo: "standard", roles_permitidos: ["SuperAdmin", "Reclutador"] },
                "m4_metricas": { id: "m4_metricas", titulo: "Estadísticas Demog.", descripcion: "Dashboard analítico de KPIs y métricas demográficas.", icono: "fa-chart-pie", url: `${BASE_URL}m4_metricas.html`, activo: true, orden: 4, tipo: "standard", roles_permitidos: ["SuperAdmin", "Reclutador"] },
                "m5_staff": { id: "m5_staff", titulo: "Control Reclutadores", descripcion: "Administración de usuarios, roles y permisos.", icono: "fa-users-gears", url: `${BASE_URL}m5_staff.html`, activo: true, orden: 5, tipo: "standard", roles_permitidos: ["SuperAdmin"] },
                "m6_transporte": { id: "m6_transporte", titulo: "Logística Transporte (IA)", descripcion: "Motor IA Gemini para optimización de rutas.", icono: "fa-bus", url: `${BASE_URL}m6_transporte.html`, activo: true, orden: 6, tipo: "standard", roles_permitidos: ["SuperAdmin", "Logistico"] },
                "m7_logs": { id: "m7_logs", titulo: "Caja Negra / Auditoría", descripcion: "Caja negra inalterable de auditoría e historial global.", icono: "fa-shield-halved", url: `${BASE_URL}m7_logs.html`, activo: true, orden: 7, tipo: "critical", roles_permitidos: ["SuperAdmin"] },
                "m8_creador_modulos": { id: "m8_creador_modulos", titulo: "Creador de Módulos", descripcion: "Inyección dinámica y expansión de nuevas vistas.", icono: "fa-screwdriver-wrench", url: `${BASE_URL}m8_creador_modulos.html`, activo: true, orden: 8, tipo: "core", roles_permitidos: ["SuperAdmin"] }
            };

            refModulos.update(estructuraMaestra).then(() => {
                inicializarRendersTiempoReal();
            }).catch(err => {
                console.error("Error actualizando rutas:", err);
                inicializarRendersTiempoReal();
            });
        }

        // Renderizado dinámico en tiempo real
        function inicializarRendersTiempoReal() {
            const contenedorDinamico = document.getElementById("hub-modulos-dinamico");
            
            db.ref("modulos_config").orderByChild("orden").on("value", (snapshot) => {
                if (!snapshot.exists()) {
                    contenedorDinamico.innerHTML = `<p class="text-center text-muted">No hay módulos disponibles.</p>`;
                    return;
                }

                let modulosActivos = [];
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const modulo = childSnapshot.val();
                    
                    const esActivo = modulo.activo !== false;
                    const rolesPermitidos = modulo.roles_permitidos || ["SuperAdmin"];
                    const tienePermiso = rolUsuarioActivo === "SuperAdmin" || rolesPermitidos.includes(rolUsuarioActivo);

                    if (esActivo && tienePermiso) {
                        modulosActivos.push({ id: id, ...modulo });
                    }
                });

                contenedorDinamico.innerHTML = "";

                if (modulosActivos.length === 0) {
                    contenedorDinamico.innerHTML = `<div class="text-center text-slate-400 py-5">No tienes módulos asignados para tu rol.</div>`;
                    return;
                }

                let filaActual = document.createElement("div");
                filaActual.className = "row-blocks";

                modulosActivos.forEach((modulo, index) => {
                    let claseIdentificador = "";
                    if (modulo.tipo === "critical") claseIdentificador = "critical-node";
                    else if (modulo.tipo === "core") claseIdentificador = "core-node";
                    else if (!["m1_empresas", "m2_vacantes", "m3_agenda", "m4_metricas", "m5_staff", "m6_transporte", "m7_logs", "m8_creador_modulos"].includes(modulo.id)) {
                        claseIdentificador = "custom-node";
                    }

                    const iconoRaw = modulo.icono || 'fa-box';
                    const iconoHTML = iconoRaw.startsWith('fa-') || iconoRaw.startsWith('fa') 
                        ? `<i class="fa-solid ${iconoRaw}"></i>` 
                        : `<span>${iconoRaw}</span>`;

                    // Garantiza la ruta absoluta limpia
                    let rutaEnlace = modulo.url || `${BASE_URL}${modulo.id}.html`;

                    const tarjetaHTML = `
                        <div class="module-node ${claseIdentificador}">
                            <div class="node-flag"></div>
                            <span class="node-id">${modulo.id}</span>
                            <h2 class="module-title">${modulo.titulo}</h2>
                            <p class="module-desc">${modulo.descripcion || 'Sin descripción.'}</p>
                            <div class="icon-indicator">
                                ${iconoHTML}
                            </div>
                            <a href="${rutaEnlace}" class="btn-ergonomic">Abrir</a>
                        </div>
                    `;

                    filaActual.innerHTML += tarjetaHTML;

                    if ((index + 1) % 4 === 0 || index === modulosActivos.length - 1) {
                        contenedorDinamico.appendChild(filaActual);
                        if (index < modulosActivos.length - 1) {
                            filaActual = document.createElement("div");
                            filaActual.className = "row-blocks";
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
