<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Consola de Control Maestro</title>
    
    <!-- Frameworks de Estilo e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-orange: #ff6600;
            --primary-orange-hover: #e05500;
            --primary-orange-glow: rgba(255, 102, 0, 0.35);
            --bg-page: #030712;          
            --card-bg: rgba(15, 23, 42, 0.65);          
            --border-subtle: rgba(255, 102, 0, 0.18);     
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;       
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0d1e3d 0%, var(--bg-page) 85%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px;
        }

        /* BARRA DE NAVEGACIÓN SUPERIOR CON GLASSMORPHISM */
        .navbar-clean {
            background: rgba(3, 7, 18, 0.85);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .navbar-brand-tech {
            color: var(--text-main) !important;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand-tech span {
            color: var(--primary-orange);
            text-shadow: 0 0 10px var(--primary-orange-glow);
        }

        /* INDICADORES Y ACCIONES EN BARRA NAV */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-pill {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .user-pill {
            background: rgba(255, 102, 0, 0.08);
            border: 1px solid rgba(255, 102, 0, 0.3);
            color: var(--primary-orange);
        }

        /* EFECTO LED DE FIREBASE (PULSE LIVE) */
        .pulse-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: blinkLed 1.8s infinite ease-in-out;
        }

        @keyframes blinkLed {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* BOTONES INTERACTIVOS SUPERIORES */
        .btn-tech-outline {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-tech-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        .btn-tech-danger {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-tech-danger:hover {
            background: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* ENCABEZADO CENTRAL */
        .hero-section {
            text-align: center;
            padding: 45px 20px 25px 20px;
        }

        .hero-section h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 520px;
            margin: 0 auto;
        }

        /* CONTENEDOR MAESTRO */
        .catalog-container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* CUADRÍCULA DINÁMICA (4 COLUMNAS) */
        .row-blocks {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 22px;
        }

        /* TARJETAS DE MÓDULO CON GLOW & ELEVACIÓN */
        .module-node {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 26px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;    
            text-align: center;     
            min-height: 250px;      
            position: relative;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .module-node:hover {
            border-color: var(--primary-orange);
            background: rgba(15, 23, 42, 0.85);
            transform: translateY(-6px);
            box-shadow: 0 18px 35px -5px rgba(0, 0, 0, 0.6), 0 0 20px var(--primary-orange-glow);
        }

        /* BADGES / PILLS DE TIPO DE MÓDULO (SUPERIOR DERECHA) */
        .badge-type {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .critical-node .badge-type {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .core-node .badge-type {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .custom-node .badge-type {
            background: rgba(168, 85, 247, 0.1);
            color: #c084fc;
            border-color: rgba(168, 85, 247, 0.3);
        }

        /* ID DEL MÓDULO */
        .node-id {
            font-family: monospace;
            font-size: 0.7rem;
            color: var(--primary-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            opacity: 0.85;
        }

        /* TÍTULO PRINCIPAL */
        .module-title {
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.2px;
        }

        /* DESCRIPCIÓN ATENUADA */
        .module-desc {
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.45;
            margin-bottom: 16px;
            max-width: 220px;
        }

        /* ICONO INTERACTIVO */
        .icon-indicator {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            opacity: 0.75;
            transition: all 0.3s ease;
        }

        .module-node:hover .icon-indicator {
            color: var(--primary-orange);
            opacity: 1;
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px var(--primary-orange));
        }

        /* BOTÓN ERGONÓMICO MAESTRO */
        .btn-ergonomic {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 8px 26px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-top: auto; 
            transition: all 0.3s ease;
            display: inline-block;
        }

        .module-node:hover .btn-ergonomic {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 4px 15px var(--primary-orange-glow);
        }

        /* SKELETON PRECARGA */
        .skeleton-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }
        .skeleton-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 16px;
            height: 250px;
        }

        @media (max-width: 992px) {
            .row-blocks, .skeleton-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .row-blocks, .skeleton-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
    <nav class="navbar navbar-clean">
        <div class="container px-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="navbar-brand-tech">
                Core<span>Hub</span>
            </span>

            <div class="nav-actions">
                <!-- Estado Firebase con LED Vivo -->
                <span class="status-pill">
                    <span class="pulse-led"></span>
                    <span class="text-white-50">Firebase:</span>
                    <span style="color: #4ade80;">Online</span>
                </span>

                <!-- Repositorio GitHub -->
                <a href="https://github.com/valdomtec-arch/bolsa-trabajo-principal" target="_blank" class="btn-tech-outline">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub Repo</span>
                </a>

                <!-- Sesión de Usuario -->
                <span id="userSessionDisplay" class="status-pill user-pill">
                    Autenticando...
                </span>

                <!-- Botón Desconectar Terminal -->
                <button onclick="cerrarSesionAdmin()" class="btn-tech-danger" title="Cerrar Sesión Operativa">
                    <i class="fa-solid fa-power-off"></i>
                    <span>Desconectar</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ENCABEZADO DE LA CONSOLA -->
    <header class="hero-section">
        <h1>Consola de Control</h1>
        <p>Estructura operativa global sincronizada en tiempo real.</p>
    </header>

    <!-- CONTENEDOR CENTRAL DEL CATÁLOGO -->
    <main class="catalog-container">
        <div id="hub-modulos-dinamico">
            <div class="skeleton-row mb-3">
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
            </div>
            <div class="skeleton-row">
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
            </div>
        </div>
    </main>

    <!-- DEPENDENCIAS OFICIALES DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let usuarioLogueadoObj = null;
        let rolUsuarioActivo = "SuperAdmin";
        let permisosManualesUsuario = null;
        const BASE_URL = "https://valdomtec-arch.github.io/bolsa-trabajo-principal/";

        document.addEventListener("DOMContentLoaded", () => {
            const usuarioSesion = sessionStorage.getItem('usuarioLogueado') || localStorage.getItem('usuarioLogueado');
            
            if (usuarioSesion) {
                try {
                    usuarioLogueadoObj = JSON.parse(usuarioSesion);
                    const userId = usuarioLogueadoObj.id || usuarioLogueadoObj.key || usuarioLogueadoObj.telefono;

                    // Consultar en tiempo real los permisos actualizados en Firebase
                    if (userId) {
                        db.ref(`usuarios_reclutadores/${userId}`).once('value').then((snap) => {
                            if (snap.exists()) {
                                const dbUserData = snap.val();
                                rolUsuarioActivo = dbUserData.rol || usuarioLogueadoObj.rol || "Reclutador";
                                permisosManualesUsuario = dbUserData.permisosManuales || null;
                                
                                document.getElementById('userSessionDisplay').innerText = `${dbUserData.nombre || 'Usuario'} • ${rolUsuarioActivo}`;
                            } else {
                                fallbackSesion(usuarioLogueadoObj);
                            }
                            inicializarRendersTiempoReal();
                        }).catch(() => {
                            fallbackSesion(usuarioLogueadoObj);
                            inicializarRendersTiempoReal();
                        });
                    } else {
                        fallbackSesion(usuarioLogueadoObj);
                        inicializarRendersTiempoReal();
                    }

                } catch(e) {
                    rolUsuarioActivo = "SuperAdmin";
                    document.getElementById('userSessionDisplay').innerText = `Administrador • SuperAdmin`;
                    inicializarRendersTiempoReal();
                }
            } else {
                rolUsuarioActivo = "SuperAdmin";
                document.getElementById('userSessionDisplay').innerText = `Sesión Directa • SuperAdmin`;
                inicializarRendersTiempoReal();
            }
        });

        function fallbackSesion(usuarioObj) {
            rolUsuarioActivo = usuarioObj.rol || "SuperAdmin";
            permisosManualesUsuario = usuarioObj.permisosManuales || null;
            document.getElementById('userSessionDisplay').innerText = `${usuarioObj.nombre || 'Administrador'} • ${rolUsuarioActivo}`;
        }

        // Redirección segura a index.html al desconectar
        function cerrarSesionAdmin() {
            sessionStorage.removeItem('usuarioLogueado');
            localStorage.removeItem('usuarioLogueado');
            window.location.href = BASE_URL + "index.html";
        }

        // Estructura de respaldo ante bases vacías
        function verificarYRestaurarBase() {
            const refModulos = db.ref("modulos_config");
            const estructuraMaestra = {
                "m1_empresas": { id: "m1_empresas", titulo: "Registrar Empresas", descripcion: "Alta de clientes corporativos, marcas y logos.", icono: "fa-building", url: `${BASE_URL}m1_empresas.html`, activo: true, orden: 1, tipo: "standard", roles_permitidos: ["SuperAdmin", "Admin", "Administrador", "Gerente General"] },
                "m2_vacantes": { id: "m2_vacantes", titulo: "Control Vacantes (IA)", descripcion: "Motor IA Gemini para extracción de perfiles.", icono: "fa-briefcase", url: `${BASE_URL}m2_vacantes.html`, activo: true, orden: 2, tipo: "standard", roles_permitidos: ["SuperAdmin", "Admin", "Administrador", "Gerente General"] },
                "m3_agenda": { id: "m3_agenda", titulo: "Agenda y Postulantes", descripcion: "Seguimiento de candidatos y generación de acuse.html.", icono: "fa-calendar-days", url: `${BASE_URL}m3_agenda.html`, activo: true, orden: 3, tipo: "standard", roles_permitidos: ["SuperAdmin", "Admin", "Administrador", "Gerente General"] },
                "m4_metricas": { id: "m4_metricas", titulo: "Estadísticas Demog.", descripcion: "Dashboard analítico de KPIs y métricas demográficas.", icono: "fa-chart-pie", url: `${BASE_URL}m4_metricas.html`, activo: true, orden: 4, tipo: "standard", roles_permitidos: ["SuperAdmin", "Admin", "Administrador", "Gerente General"] },
                "m5_staff": { id: "m5_staff", titulo: "Control Reclutadores", descripcion: "Administración de usuarios, roles y permisos.", icono: "fa-users-gears", url: `${BASE_URL}m5_staff.html`, activo: true, orden: 5, tipo: "standard", roles_permitidos: ["SuperAdmin", "Admin", "Administrador"] },
                "m6_transporte": { id: "m6_transporte", titulo: "Logística Transporte (IA)", descripcion: "Motor IA Gemini para optimización de rutas.", icono: "fa-bus", url: `${BASE_URL}m6_transporte.html`, activo: true, orden: 6, tipo: "standard", roles_permitidos: ["SuperAdmin", "Admin", "Administrador"] },
                "m7_logs": { id: "m7_logs", titulo: "Caja Negra / Auditoría", descripcion: "Caja negra inalterable de auditoría e historial global.", icono: "fa-shield-halved", url: `${BASE_URL}m7_logs.html`, activo: true, orden: 7, tipo: "critical", roles_permitidos: ["SuperAdmin", "Admin", "Administrador"] },
                "m8_creador_modulos": { id: "m8_creador_modulos", titulo: "Creador de Módulos", descripcion: "Inyección dinámica y expansión de nuevas vistas.", icono: "fa-screwdriver-wrench", url: `${BASE_URL}m8_creador_modulos.html`, activo: true, orden: 8, tipo: "core", roles_permitidos: ["SuperAdmin", "Admin", "Administrador"] }
            };
            refModulos.update(estructuraMaestra);
        }

        // Renderizado dinámico respetando los permisos manuales del Módulo 5
        function inicializarRendersTiempoReal() {
            const contenedorDinamico = document.getElementById("hub-modulos-dinamico");
            
            db.ref("modulos_config").orderByChild("orden").on("value", (snapshot) => {
                if (!snapshot.exists()) {
                    verificarYRestaurarBase();
                    return;
                }

                let modulosActivos = [];
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const modulo = childSnapshot.val();
                    
                    const esActivo = modulo.activo !== false;
                    const esAdminGlobal = ["SuperAdmin", "Admin", "Administrador", "Gerente General"].includes(rolUsuarioActivo);
                    
                    let tienePermiso = false;

                    if (esAdminGlobal) {
                        // El Admin y Gerente ven todo por defecto
                        tienePermiso = true;
                    } else if (permisosManualesUsuario && typeof permisosManualesUsuario === 'object') {
                        // EVALUACIÓN DE PERMISOS MANUALES ASIGNADOS EN EL MÓDULO 5
                        // Mapeo entre id de módulo en config (ej. m8_creador_modulos) vs M5 (ej. m8_creador)
                        let keyEnM5 = id;
                        if (id === "m8_creador_modulos") keyEnM5 = "m8_creador";

                        tienePermiso = permisosManualesUsuario[keyEnM5] === true;
                    } else {
                        // Fallback si no hay matriz asignada aún
                        const rolesPermitidos = modulo.roles_permitidos || ["SuperAdmin", "Admin", "Administrador"];
                        tienePermiso = rolesPermitidos.includes(rolUsuarioActivo);
                    }

                    if (esActivo && tienePermiso) {
                        modulosActivos.push({ id: id, ...modulo });
                    }
                });

                contenedorDinamico.innerHTML = "";

                if (modulosActivos.length === 0) {
                    contenedorDinamico.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fa-solid fa-lock text-warning mb-3" style="font-size: 3rem;"></i>
                            <h4 class="text-white">Acceso Limitado</h4>
                            <p class="text-muted">No tienes módulos habilitados actualmente. Contacta al Administrador para solicitar accesos.</p>
                        </div>
                    `;
                    return;
                }

                let filaActual = document.createElement("div");
                filaActual.className = "row-blocks";

                modulosActivos.forEach((modulo, index) => {
                    let claseIdentificador = "";
                    let textoBadge = "STANDARD";

                    if (modulo.tipo === "critical") {
                        claseIdentificador = "critical-node";
                        textoBadge = "CRITICAL";
                    } else if (modulo.tipo === "core") {
                        claseIdentificador = "core-node";
                        textoBadge = "CORE";
                    } else if (!["m1_empresas", "m2_vacantes", "m3_agenda", "m4_metricas", "m5_staff", "m6_transporte", "m7_logs", "m8_creador_modulos"].includes(modulo.id)) {
                        claseIdentificador = "custom-node";
                        textoBadge = "CUSTOM";
                    }

                    const iconoRaw = modulo.icono || 'fa-box';
                    const iconoHTML = iconoRaw.startsWith('fa-') || iconoRaw.startsWith('fa') 
                        ? `<i class="fa-solid ${iconoRaw}"></i>` 
                        : `<span>${iconoRaw}</span>`;

                    let rutaEnlace = "";
                    if (modulo.url && modulo.url.startsWith("http")) {
                        rutaEnlace = modulo.url;
                    } else if (modulo.url && modulo.url.endsWith(".html")) {
                        rutaEnlace = BASE_URL + modulo.url.replace(/^\//, '');
                    } else {
                        rutaEnlace = `${BASE_URL}${modulo.id}.html`;
                    }

                    const tarjetaHTML = `
                        <div class="module-node ${claseIdentificador}" id="card_${modulo.id}">
                            <span class="badge-type">${textoBadge}</span>
                            <span class="node-id">${modulo.id}</span>
                            <h2 class="module-title">${modulo.titulo || modulo.id}</h2>
                            <p class="module-desc">${modulo.descripcion || 'Sin descripción.'}</p>
                            <div class="icon-indicator">
                                ${iconoHTML}
                            </div>
                            <a href="${rutaEnlace}" class="btn-ergonomic">Abrir</a>
                        </div>
                    `;

                    filaActual.innerHTML += tarjetaHTML;

                    if ((index + 1) % 4 === 0 || index === modulosActivos.length - 1) {
                        contenedorDinamico.appendChild(filaActual);
                        if (index < modulosActivos.length - 1) {
                            filaActual = document.createElement("div");
                            filaActual.className = "row-blocks";
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
