<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Consola de Control Maestro</title>
    
    <!-- Frameworks de Estilo e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-orange: #ff6600;
            --primary-orange-hover: #e05500;
            --bg-page: #030712;          
            --card-bg: rgba(15, 23, 42, 0.55);          
            --border-subtle: rgba(255, 102, 0, 0.12);     
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;       
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #0d1e3d 0%, var(--bg-page) 85%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 60px;
        }

        /* BARRA DE NAVEGACIÓN SUPERIOR */
        .navbar-clean {
            background: rgba(3, 7, 18, 0.8);
            border-bottom: 2px solid var(--border-subtle);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 0;
        }

        .navbar-brand-tech {
            color: var(--text-main) !important;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .navbar-brand-tech span {
            color: var(--primary-orange);
        }

        .user-pill {
            background: rgba(255, 102, 0, 0.06);
            border: 1px solid rgba(255, 102, 0, 0.2);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-orange);
            letter-spacing: 0.5px;
        }

        /* ENCABEZADO CENTRAL */
        .hero-section {
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        .hero-section h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }

        /* CONTENEDOR MAESTRO DE BLOQUES INAMOVIBLES (4 ARRIBA, 4 ABAJO) */
        .catalog-container {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* FILA PERFECTAMENTE CONTROLADA EN ESCRITORIO */
        .row-blocks {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Obliga a que sean 4 bloques exactos */
            gap: 20px;
            margin-bottom: 20px;
        }

        /* ESTRUCTURA INDIVIDUAL DEL BLOQUE CENTRADO ABSOLUTO */
        .module-node {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;    /* Eje central */
            text-align: center;     /* Justificación central */
            min-height: 240px;      /* Altura uniforme para todos */
            position: relative;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .module-node:hover {
            border-color: rgba(255, 102, 0, 0.4);
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        /* INDICADOR ESTRATÉGICO SUPERIOR (ID MONOESPACIADO) */
        .node-id {
            font-family: monospace;
            font-size: 0.7rem;
            color: var(--primary-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        /* TÍTULO PRINCIPAL CON JERARQUÍA IMPONENTE */
        .module-title {
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        /* DESCRIPCIÓN ATENUADA PARA SOPORTE VISUAL */
        .module-desc {
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 220px;
        }

        /* ICONO COMPACTO COMO GUÍA INTEGRADA */
        .icon-indicator {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .module-node:hover .icon-indicator {
            color: var(--primary-orange);
            opacity: 1;
            transform: scale(1.1);
        }

        /* EL BOTÓN ERGONÓMICO MAESTRO */
        .btn-ergonomic {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: auto; /* Fuerza la alineación al final de la tarjeta */
            transition: all 0.2s ease;
            width: fit-content;
        }

        .module-node:hover .btn-ergonomic {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.25);
        }

        /* PUNTO DE AUDITORÍA INTEGRADO DISCRETO */
        .node-flag {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }
        .critical-node .node-flag { background: #ef4444; }
        .core-node .node-flag { background: #3b82f6; }

        /* SKELETON PRECARGA */
        .skeleton-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .skeleton-box {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 14px;
            height: 240px;
        }

        /* RESPONSIVIDAD AJUSTADA EXCLUSIVAMENTE PARA PANTALLAS CHICAS */
        @media (max-width: 992px) {
            .row-blocks, .skeleton-row {
                grid-template-columns: repeat(2, 1fr); /* 2x2 en tablets */
            }
        }

        @media (max-width: 576px) {
            .row-blocks, .skeleton-row {
                grid-template-columns: 1fr; /* Columna única perfecta centrada en celulares */
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-clean">
        <div class="container px-4 d-flex justify-content-between align-items-center">
            <span class="navbar-brand-tech">
                Core<span>Hub</span>
            </span>
            <span id="userSessionDisplay" class="user-pill">
                Autenticando...
            </span>
        </div>
    </nav>

    <!-- ENCABEZADO DE LA CONSOLA -->
    <header class="hero-section">
        <h1>Consola de Control</h1>
        <p>Estructura operativa global sincronizada en tiempo real.</p>
        <button onclick="cerrarSesionAdmin()" class="btn btn-sm btn-link text-decoration-none text-muted p-0 font-monospace" style="font-size: 0.75rem;">
            <i class="fa-solid fa-power-off me-1"></i> Desconectar Terminal
        </button>
    </header>

    <!-- CONTENEDOR CENTRAL DEL CATÁLOGO (FILAS DIRECTAS) -->
    <main class="catalog-container">
        
        <!-- Contenedor dinámico que será administrado por Firebase -->
        <div id="hub-modulos-dinamico">
            <!-- Bloques de carga simétricos iniciales -->
            <div class="skeleton-row mb-3">
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
            </div>
            <div class="skeleton-row">
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
                <div class="skeleton-box"></div>
            </div>
        </div>

    </main>

    <!-- DEPENDENCIAS OFICIALES DE FIREBASE (COMPAT) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Configuración del servidor remoto del cliente
        const firebaseConfig = {
            databaseURL: "https://bolsa-de-trabajo-a52e4-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Control de Sesión y Autenticación Obligatoria
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioSesion = sessionStorage.getItem('usuarioLogueado');
            
            if (!usuarioSesion) {
                window.location.href = "https://valdomtec-arch.github.io/bolsa-trabajo-principal/";
                return;
            }

            const usuario = JSON.parse(usuarioSesion);
            document.getElementById('userSessionDisplay').innerText = `${usuario.nombre} • ${usuario.rol}`;

            verificarYFijarCatalogo(() => {
                inicializarRendersTiempoReal();
            });
        });

        function cerrarSesionAdmin() {
            sessionStorage.removeItem('usuarioLogueado');
            window.location.href = "https://valdomtec-arch.github.io/bolsa-trabajo-principal/";
        }

        // Semilla base para inyectar ordenadamente los 8 módulos con su orden estricto
        function verificarYFijarCatalogo(callback) {
            const refModulos = db.ref("modulos_config");

            refModulos.once("value", (snapshot) => {
                if (!snapshot.exists()) {
                    const estructuraMaestra = {
                        "m1_empresas": { id: "m1_empresas", titulo: "Registrar Empresas", descripcion: "Control maestro de clientes corporativos y logotipos.", icono: "fa-building", archivo_url: "m1_empresas.html", activo: true, orden: 1, tipo: "standard" },
                        "m2_vacantes": { id: "m2_vacantes", titulo: "Extracción de Vacantes", descripcion: "Procesamiento y lectura inteligente de perfiles laborales.", icono: "fa-briefcase", archivo_url: "m2_vacantes.html", activo: true, orden: 2, tipo: "standard" },
                        "m3_agenda": { id: "m3_agenda", titulo: "Agenda de Postulantes", descripcion: "Seguimiento cronológico de candidatos y citas activas.", icono: "fa-calendar-days", archivo_url: "m3_agenda.html", activo: true, orden: 3, tipo: "standard" },
                        "m6_transporte": { id: "m6_transporte", titulo: "Logística de Transporte", descripcion: "Administración inteligente de rutas operativas aisladas.", icono: "fa-bus", archivo_url: "m6_transporte.html", activo: true, orden: 4, tipo: "standard" },
                        "m4_metricas": { id: "m4_metricas", titulo: "Estadística Demográfica", descripcion: "Analítica transversal de cobertura y rendimiento general.", icono: "fa-chart-pie", archivo_url: "m4_metricas.html", activo: true, orden: 5, tipo: "standard" },
                        "m5_staff": { id: "m5_staff", titulo: "Control de Reclutadores", descripcion: "Gestión de personal de staff, cuentas y accesos.", icono: "fa-users-gears", archivo_url: "m5_staff.html", activo: true, orden: 6, tipo: "standard" },
                        "m7_logs": { id: "m7_logs", titulo: "Logs del Sistema", descripcion: "Auditoría e historial inalterable de transacciones.", icono: "fa-shield-halved", archivo_url: "m7_logs.html", activo: true, orden: 7, tipo: "critical" },
                        "m8_creador_modulos": { id: "m8_creador_modulos", titulo: "Creador de Módulos", descripcion: "Inyección y desarrollo dinámico de nuevos accesos.", icono: "fa-screwdriver-wrench", archivo_url: "m8_creador_modulos.html", activo: true, orden: 8, tipo: "core" }
                    };
                    refModulos.set(estructuraMaestra).then(() => callback());
                } else {
                    callback();
                }
            });
        }

        // Renderizador Orquestador: Divide los módulos exactamente en 4 arriba y 4 abajo
        function inicializarRendersTiempoReal() {
            const contenedorDinamico = document.getElementById("hub-modulos-dinamico");
            
            db.ref("modulos_config").orderByChild("orden").on("value", (snapshot) => {
                if (!snapshot.exists()) return;

                let modulosActivos = [];
                snapshot.forEach((childSnapshot) => {
                    const modulo = childSnapshot.val();
                    if (modulo.activo) {
                        modulosActivos.push(modulo);
                    }
                });

                // Limpiamos contenedor
                contenedorDinamico.innerHTML = "";

                // Creamos los bloques de manera estructural (Fila 1 y Fila 2)
                let filaFisica1 = document.createElement("div");
                filaFisica1.className = "row-blocks";
                
                let filaFisica2 = document.createElement("div");
                filaFisica2.className = "row-blocks";

                modulosActivos.forEach((modulo, index) => {
                    let claseIdentificador = "";
                    if (modulo.tipo === "critical") claseIdentificador = "critical-node";
                    if (modulo.tipo === "core") claseIdentificador = "core-node";

                    const tarjetaHTML = `
                        <div class="module-node ${claseIdentificador}">
                            <div class="node-flag"></div>
                            <span class="node-id">${modulo.id}</span>
                            <h2 class="module-title">${modulo.titulo}</h2>
                            <p class="module-desc">${modulo.descripcion}</p>
                            <div class="icon-indicator">
                                <i class="fa-solid ${modulo.icono || 'fa-box'}"></i>
                            </div>
                            <a href="${modulo.archivo_url}" class="btn-ergonomic">Abrir</a>
                        </div>
                    `;

                    // Distribución exacta: primeros 4 arriba, siguientes 4 abajo
                    if (index < 4) {
                        filaFisica1.innerHTML += tarjetaHTML;
                    } else {
                        filaFisica2.innerHTML += tarjetaHTML;
                    }
                });

                // Inyección limpia al documento principal
                contenedorDinamico.appendChild(filaFisica1);
                contenedorDinamico.appendChild(filaFisica2);
            });
        }
    </script>
</body>
</html>
